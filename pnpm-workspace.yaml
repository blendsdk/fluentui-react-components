packages:
  - 'packages/*'

# pnpm blocks lifecycle scripts by default. esbuild's postinstall selects and
# validates the platform binary that Vite and Vitest run on, so it is allowed.
allowBuilds:
  esbuild: true

# The release flow (scripts invoked by .github/workflows/release.yml) commits
# the version bump locally and publishes before pushing that commit, so pnpm's
# "up to date with remote" publish check would reject every release. The
# release workflow validates the branch itself before publishing.
gitChecks: false

# pnpm's supply-chain policy holds back recently published versions. These
# entries exempt the pinned toolchain versions (Vitest 5, jsdom 30 and their
# @vitest dependencies) so installs resolve the lockfile instead of stalling on
# the release-age gate. pnpm maintains the list automatically.
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - jsdom@30.1.3
  - vitest@5.0.5

# npm scans uploads for malware at publish time, which can delay a version's
# visibility. Wait (up to ten minutes) for the published version to appear so
# publishing multiple packages never races the registry.
publishWaitTimeout: 600000
