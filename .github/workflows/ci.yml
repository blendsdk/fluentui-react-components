name: CI — Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check skills
        run: pnpm skill:check

      - name: Type-check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Verify packaged skills
        run: pnpm skills:check

      - name: Test
        run: pnpm test

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Verify the publish artifact
        run: pnpm pack:check

  browser-matrix:
    name: Browser Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @blendsdk/fluentui-react-components exec playwright install --with-deps chromium firefox webkit

      - name: Run browser matrix
        run: pnpm test:browser:all

  performance:
    name: Performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @blendsdk/fluentui-react-components exec playwright install --with-deps chromium

      - name: Run performance tests
        run: pnpm test:perf
